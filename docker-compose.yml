services:
  seedream-mcp:
    # 固定 major.minor 标签，随稳定版补丁自动跟进，升级大版本时手动修改；预发布版本
    # 会同样产出该标签，引用 rc 需改用精确版本号。
    image: ghcr.io/tengmmvp/seedream_mcp:3.0
    container_name: seedream-mcp-server
    # 末位参数默认豁免容器内非回环绑定的 TLS 门禁；对外暴露时以证书参数替换，如
    # SEEDREAM_EXTRA_CLI_ARGS="--ssl-certfile /certs/tls.pem --ssl-keyfile /certs/tls.key"，
    # 证书路径需自行在 volumes 增挂。
    command: >-
      --transport streamable-http
      --host 0.0.0.0
      --port 8000
      ${SEEDREAM_EXTRA_CLI_ARGS:---insecure-allow-non-tls}
    ports:
      # 默认仅本机回环可达；改为 0.0.0.0 对外暴露前必须先具备 TLS，详见 README 安全说明。
      - "127.0.0.1:${SEEDREAM_HTTP_PORT:-8000}:8000"
    environment:
      # 必需
      - ARK_API_KEY=${ARK_API_KEY}
      # 模型与端点
      - ARK_BASE_URL=${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - SEEDREAM_ALLOW_HTTP_BASE_URL=${SEEDREAM_ALLOW_HTTP_BASE_URL:-false}
      - SEEDREAM_MODEL_ID=${SEEDREAM_MODEL_ID:-doubao-seedream-5.0}
      - SEEDREAM_DEFAULT_SIZE=${SEEDREAM_DEFAULT_SIZE:-2K}
      - SEEDREAM_DEFAULT_WATERMARK=${SEEDREAM_DEFAULT_WATERMARK:-false}
      # 目录与日志
      # 数据根目录，默认 /app 即挂载目录。
      - SEEDREAM_DATA_ROOT=${SEEDREAM_DATA_ROOT:-/app}
      # 工作根目录声明，默认 /app 使挂载目录进入读取范围。
      - SEEDREAM_WORKSPACE_ROOT=${SEEDREAM_WORKSPACE_ROOT:-/app}
      - SEEDREAM_LOG_LEVEL=${SEEDREAM_LOG_LEVEL:-INFO}
      - SEEDREAM_LOG_ROTATION_SIZE=${SEEDREAM_LOG_ROTATION_SIZE:-5}
      - SEEDREAM_LOG_RETENTION_DAYS=${SEEDREAM_LOG_RETENTION_DAYS:-7}
      # 自动保存
      - SEEDREAM_AUTO_SAVE_ENABLED=${SEEDREAM_AUTO_SAVE_ENABLED:-true}
      - SEEDREAM_AUTO_SAVE_MAX_CONCURRENT=${SEEDREAM_AUTO_SAVE_MAX_CONCURRENT:-5}
      - SEEDREAM_AUTO_SAVE_DOWNLOAD_TIMEOUT=${SEEDREAM_AUTO_SAVE_DOWNLOAD_TIMEOUT:-30}
      - SEEDREAM_AUTO_SAVE_MAX_RETRIES=${SEEDREAM_AUTO_SAVE_MAX_RETRIES:-3}
      - SEEDREAM_AUTO_SAVE_MAX_FILE_SIZE=${SEEDREAM_AUTO_SAVE_MAX_FILE_SIZE:-52428800}
      - SEEDREAM_RESPONSE_BODY_LIMIT=${SEEDREAM_RESPONSE_BODY_LIMIT:-}
      - SEEDREAM_AUTO_SAVE_DATE_FOLDER=${SEEDREAM_AUTO_SAVE_DATE_FOLDER:-true}
      - SEEDREAM_AUTO_SAVE_CLEANUP_DAYS=${SEEDREAM_AUTO_SAVE_CLEANUP_DAYS:-30}
      - SEEDREAM_AUTO_SAVE_MAX_TOTAL_BYTES=${SEEDREAM_AUTO_SAVE_MAX_TOTAL_BYTES:-10737418240}
      - SEEDREAM_AUTO_SAVE_FSYNC=${SEEDREAM_AUTO_SAVE_FSYNC:-false}
      - SEEDREAM_PREVIEW_ENABLED=${SEEDREAM_PREVIEW_ENABLED:-true}
      # 性能与超时
      - SEEDREAM_TIMEOUT=${SEEDREAM_TIMEOUT:-60}
      - SEEDREAM_API_TIMEOUT=${SEEDREAM_API_TIMEOUT:-600}
      - SEEDREAM_MAX_RETRIES=${SEEDREAM_MAX_RETRIES:-3}
      - SEEDREAM_STREAM_BUFFER_MAX_SIZE=${SEEDREAM_STREAM_BUFFER_MAX_SIZE:-10485760}
      - SEEDREAM_STREAM_CHUNK_SIZE=${SEEDREAM_STREAM_CHUNK_SIZE:-1048576}
      - SEEDREAM_SSE_EVENT_MAX_SIZE=${SEEDREAM_SSE_EVENT_MAX_SIZE:-}
      - SEEDREAM_IMAGE_PREPARE_CONCURRENCY=${SEEDREAM_IMAGE_PREPARE_CONCURRENCY:-5}
      - SEEDREAM_PREPARE_CACHE_MAX=${SEEDREAM_PREPARE_CACHE_MAX:-32}
      - SEEDREAM_PREPARE_CACHE_MAX_BYTES=${SEEDREAM_PREPARE_CACHE_MAX_BYTES:-268435456}
      # 传输与 Web
      # streamable-http Bearer 鉴权令牌，非回环绑定必须配置。
      - SEEDREAM_HTTP_AUTH_TOKEN=${SEEDREAM_HTTP_AUTH_TOKEN}
      # streamable-http 请求体上限（字节），不低于 1MB。
      - SEEDREAM_HTTP_MAX_BODY_SIZE=${SEEDREAM_HTTP_MAX_BODY_SIZE:-67108864}
      # 非回环绑定的 Host 头允许列表（逗号分隔），留空整体关闭 Host 校验。
      - SEEDREAM_HTTP_ALLOWED_HOSTS=${SEEDREAM_HTTP_ALLOWED_HOSTS:-}
      # Web 操作台开关，开启后浏览器直用生成与图库页面；默认关闭，stdio 不受影响。
      - SEEDREAM_WEB_ENABLED=${SEEDREAM_WEB_ENABLED:-false}
      # requestState 多副本共享密钥环，留空保持进程内临时密钥，单进程无需配置。
      - SEEDREAM_REQUEST_STATE_KEYS=${SEEDREAM_REQUEST_STATE_KEYS:-}
    volumes:
      - ./.seedream:/app/.seedream
      # .env 需宿主机先创建为文件，否则 Docker 会生成同名目录导致挂载失败。
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('localhost', 8000), timeout=5).close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
