[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedream-image-mcp"
dynamic = ["version"]
authors = [
    {name = "TengMMVP", email = "tengmmvp@gmail.com"}
]
description = "基于火山引擎 Seedream API 的 MCP 工具，支持 AI 图像生成功能"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "seedream",
    "volcengine",
    "ai",
    "image-generation",
]

dependencies = [
    "mcp>=1.28.0,<2.0.0",
    "pydantic>=2.11.0,<3",
    "typing-extensions>=4.12.0",
    "httpx>=0.28.0,<1",
    "aiohttp>=3.11.0,<4",
    "aiofiles>=24.1.0,<26",
    "python-dotenv>=1.0.0,<2",
    "loguru>=0.7.2,<1",
    "Pillow>=11.0.0,<13",
    "pillow-heif>=1.5.0,<2",
    "uvicorn>=0.47.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "hatchling",
]

[project.urls]
Homepage = "https://github.com/tengmmvp/Seedream_MCP"
Documentation = "https://github.com/tengmmvp/Seedream_MCP#readme"
Repository = "https://github.com/tengmmvp/Seedream_MCP.git"
"Bug Tracker" = "https://github.com/tengmmvp/Seedream_MCP/issues"

[project.scripts]
seedream-image-mcp = "seedream_mcp.server:cli_main"

[tool.hatch.version]
path = "seedream_mcp/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/seedream_mcp",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE"
]

[tool.hatch.build.targets.wheel]
packages = ["seedream_mcp"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pillow_heif.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
