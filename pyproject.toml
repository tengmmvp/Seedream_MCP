[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedream-image-mcp"
dynamic = ["version"]
authors = [
    {name = "TengMMVP", email = "tengmmvp@gmail.com"}
]
description = "基于火山引擎 Seedream API 的 MCP 工具，支持 AI 图像生成功能"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "seedream",
    "volcengine",
    "ai",
    "image-generation",
]

dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic>=2.12.0,<3",
    "httpx>=0.28.0,<1",
    "aiohttp>=3.11.0,<4",
    "aiofiles>=24.1.0,<26",
    "python-dotenv>=1.0.0,<2",
    "loguru>=0.7.2,<1",
    "Pillow>=11.3.0,<13",
    "pillow-heif>=1.5.0,<2",
    "uvicorn>=0.47.0,<1",
    "starlette>=0.38.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "hatchling",
]

[project.urls]
Homepage = "https://github.com/tengmmvp/Seedream_MCP"
Documentation = "https://github.com/tengmmvp/Seedream_MCP#readme"
Repository = "https://github.com/tengmmvp/Seedream_MCP.git"
"Bug Tracker" = "https://github.com/tengmmvp/Seedream_MCP/issues"

[project.scripts]
seedream-image-mcp = "seedream_mcp.server:cli_main"

[tool.hatch.version]
path = "seedream_mcp/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/seedream_mcp",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/README.en.md",
    "/README.zh-TW.md",
    "/LICENSE",
    "/.env.example",
    "/docker-compose.yml",
    "/docs/samples"
]

[tool.hatch.build.targets.wheel]
packages = ["seedream_mcp"]

[tool.coverage.run]
# python -m 入口垫片仅转调 cli_main，不计入覆盖统计。
omit = ["seedream_mcp/__main__.py"]

[tool.coverage.report]
# 覆盖率总量门禁，pytest --cov 结束时按此值判定退出码。
fail_under = 90

[tool.coverage_floors]
# 单文件语句覆盖率下限，按当前最低文件留 3pp 余量。
line_coverage_min = 80

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
# 默认检查范围：包源码、全部测试与维护脚本。
files = [
    "seedream_mcp",
    "tests",
    "scripts",
]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pillow_heif.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
markers = ["slow: 真实端口与线程的端到端冒烟"]
