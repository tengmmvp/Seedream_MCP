# 持续集成：PR 与分支推送时运行格式校验、Lint、类型检查与单测，作为合入门禁。
# 发布流水线见 release.yml，由 v* 标签触发。
name: 🔍 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: 🧪 Lint & Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 矩阵验证 O_NOFOLLOW 兜底与 reparse point 剔除等平台专属安全路径。
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 📦 Install dependencies
        run: uv sync

      - name: 🎨 Check formatting (black)
        run: uv run black --check seedream_mcp tests

      - name: 🧹 Run flake8
        run: uv run flake8 seedream_mcp tests

      - name: 🔎 Run mypy
        run: uv run mypy seedream_mcp

      - name: ✅ Run tests
        run: uv run pytest -q
