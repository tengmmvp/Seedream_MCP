# 持续集成：合入 main 的 PR 与 main 推送时运行格式校验、Lint、类型检查、单测与 Docker 构建验证，作为合入门禁。
# 静态检查与单测的公共步骤位于 reusable-checks.yml；发布流水线见 release.yml；SDK 下界验证见 sdk-lower-bound.yml。
# 第三方 action 一律以 commit SHA 固定引用，行尾注释标注对应的版本号。
name: 🔍 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # 键取 ref：push 与 PR 的 ref 天然异组，域分离后无同提交双跑。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🧹 Lint
    uses: ./.github/workflows/reusable-checks.yml
    with:
      python-versions: '["3.12"]'
      timeout-minutes: 10
      static-checks: true

  test:
    name: 🧪 Test
    uses: ./.github/workflows/reusable-checks.yml
    with:
      # Windows 验证 O_NOFOLLOW 兜底与 reparse point 剔除等平台专属安全路径，
      # macOS 覆盖 POSIX 路径处理，与 OS Independent 声明对齐。
      oses: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      python-versions: '["3.12", "3.13", "3.14"]'
      fail-fast: false
      run-tests: true

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: 🧱 Build multi-arch Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
