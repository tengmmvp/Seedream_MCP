# 发布流水线:测试 → 发布 PyPI → 创建 GitHub Release;Docker 镜像并行推送至 GHCR
# 触发:推送 v* 标签
name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# GITHUB_TOKEN 默认权限
permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送镜像到 ghcr.io

jobs:
  # 测试矩阵:多 Python 版本跑单测、静态检查与构建验证,作为后续发布的门禁
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 📦 Install dependencies
        run: uv sync

      - name: 🧪 Run tests
        run: uv run pytest -q

      - name: 🔍 Run mypy
        run: uv run mypy seedream_mcp

      - name: 🧹 Run flake8
        run: uv run flake8 seedream_mcp tests

      - name: 🧪 Quick validation
        run: |
          uv run python -c "
          from seedream_mcp import __version__
          from seedream_mcp.config import SeedreamConfig
          from seedream_mcp.server import mcp, cli_main
          from seedream_mcp.client import SeedreamClient
          from seedream_mcp.tools import TextToImageInput, ImageToImageInput
          print('✅ 核心模块导入测试通过')
          print(f'📦 版本: {__version__}')
          print('Package validation successful')
          "

      - name: 🔍 Check package build
        run: uv build --wheel

  # 发布到 PyPI:基于 OIDC Trusted Publishing,用短期令牌替代长期 API token
  pypi-release:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # Trusted Publishing 必需:颁发 OIDC 令牌
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 🏗️ Build distributions
        run: uv build

      - name: 📦 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 创建 GitHub Release:依赖 PyPI 成功,确保 Release 中的安装说明已可用
  build-and-release:
    name: 🏗️ Build and Release
    runs-on: ubuntu-latest
    needs: [test, pypi-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## 🚀 Seedream MCP ${{ github.ref_name }}

            ### ✨ 新特性
            请查看 [GitHub Commits](https://github.com/tengmmvp/Seedream_MCP/commits)

            ### 🛠️ 安装方式

            #### 推荐方式（PyPI + uvx 一键安装）
            ```bash
            # 通过环境变量提供密钥（推荐）
            ARK_API_KEY=your_api_key_here uvx seedream-image-mcp
            ```

            或在 MCP 客户端中配置（详见 [README](https://github.com/tengmmvp/Seedream_MCP#readme)）：
            ```json
            {
              "mcpServers": {
                "seedream": {
                  "command": "uvx",
                  "args": ["seedream-image-mcp"],
                  "env": { "ARK_API_KEY": "your_api_key_here" }
                }
              }
            }
            ```

            #### Docker Compose 运行
            ```bash
            curl -O https://raw.githubusercontent.com/tengmmvp/Seedream_MCP/main/docker-compose.yml
            ARK_API_KEY=your_api_key_here docker-compose up -d
            ```

            ### 🔧 配置说明
            1. 获取火山引擎 API 密钥
            2. 通过环境变量 `ARK_API_KEY` 提供（或使用 `--api-key` 参数）
            3. 在 Claude Desktop / Cursor / VS Code 等 MCP 客户端中配置

          draft: false
          # tag 含 alpha/beta/rc 时自动标记为预发布版本
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建多架构镜像推送 GHCR:从源码构建,与 PyPI 发布相互独立、并行执行
  docker-release:
    name: 🐳 Docker Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
