# 发布流水线：测试 → 发布 PyPI → 创建 GitHub Release；Docker 镜像并行推送至 GHCR。
# 由 v* 标签触发；另支持手动触发，手动时仅运行检查作业，不执行发布。
# 第三方 action 一律以 commit SHA 固定引用，行尾注释标注对应的版本号或分支。
name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 静态检查与构建验证仅跑单个 3.12 格避免随矩阵三遍重复；mypy 另以 --python-version 补验 3.13 与 3.14，拦截新版解释器特有的类型回归。
  static-and-package:
    name: 🔍 Static & Package
    uses: ./.github/workflows/reusable-checks.yml
    permissions:
      contents: read
    with:
      python-versions: '["3.12"]'
      extra-mypy-python-versions: '["3.13", "3.14"]'
      timeout-minutes: 15
      static-checks: true
      package-checks: true

  # 测试作业：在全部声明支持的 Python 版本上跑单测，作为后续发布的门禁。
  test:
    name: 🧪 Test
    uses: ./.github/workflows/reusable-checks.yml
    permissions:
      contents: read
    with:
      python-versions: '["3.12", "3.13", "3.14"]'
      timeout-minutes: 15
      run-tests: true

  # 发布到 PyPI：基于 OIDC Trusted Publishing，用短期令牌替代长期 API token。
  pypi-release:
    name: 📤 Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, static-and-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write # Trusted Publishing 必需：颁发 OIDC 令牌。
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚡ Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: 🎁 Build distributions
        run: uv build

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # 创建 GitHub Release：依赖 PyPI 成功，确保 Release 中的安装说明已可用。
  build-and-release:
    name: 🔖 Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, static-and-package, pypi-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 取最近一个非当前 tag 作对比基线，首个版本无前序时回退 main 分支。
      - name: 📜 Resolve previous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$( (gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=10" 2>/dev/null || true) \
            | jq -r --arg current "${GITHUB_REF_NAME}" \
              '[.[].tag_name | select(. != null)] | map(select(. != $current)) | first // empty')
          echo "PREVIOUS_TAG=${prev:-main}" >> "$GITHUB_ENV"

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## ✨ Seedream MCP ${{ github.ref_name }}

            ### 📝 更新内容
            [查看自上一版本以来的全部提交](https://github.com/tengmmvp/Seedream_MCP/compare/${{ env.PREVIOUS_TAG }}...${{ github.ref_name }})

            ### 🛠️ 安装方式

            #### 推荐方式
            ```bash
            # 通过环境变量提供密钥（推荐）
            ARK_API_KEY=your_api_key_here uvx seedream-image-mcp
            ```

            或在 MCP 客户端中配置（详见 [README](https://github.com/tengmmvp/Seedream_MCP#readme)）：
            ```json
            {
              "mcpServers": {
                "seedream-image-mcp": {
                  "command": "uvx",
                  "args": ["seedream-image-mcp"],
                  "env": { "ARK_API_KEY": "your_api_key_here" }
                }
              }
            }
            ```

            #### Docker Compose 运行
            ```bash
            curl -O https://raw.githubusercontent.com/tengmmvp/Seedream_MCP/main/docker-compose.yml
            ARK_API_KEY=your_api_key_here SEEDREAM_HTTP_AUTH_TOKEN=your_token_here docker compose up -d
            ```

            ### 🔧 配置说明
            1. 获取火山引擎 API 密钥
            2. 通过环境变量 `ARK_API_KEY` 提供（或使用 `--api-key` 参数）
            3. 在 Claude Desktop / Cursor / VS Code 等 MCP 客户端中配置

          draft: false
          # tag 含 alpha/beta/rc 时自动标记为预发布版本。
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建多架构镜像推送 GHCR：从源码构建，与 PyPI 发布相互独立、并行执行。
  docker-release:
    name: 🐳 Docker Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, static-and-package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read # 检出源码构建镜像。
      packages: write # 推送镜像到 ghcr.io。

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧾 Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            # latest 标签由 type=semver 默认的 latest=auto 生成，稳定版获得 latest，预发布版不获得。
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🚢 Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
