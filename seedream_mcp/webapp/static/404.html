<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f54e00'/%3E%3C/svg%3E"
    />
    <title>404 · Seedream 工作室</title>
    <link rel="stylesheet" href="/web/static/style.css" />
    <style>
      .nf-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .nf-card {
        text-align: center;
      }

      .nf-mark {
        color: var(--accent);
        font-size: 20px;
        margin: 0 0 8px;
      }

      .nf-code {
        font-size: 72px;
        line-height: 1.1;
        letter-spacing: -0.03em;
        color: var(--ink);
        margin: 0;
      }

      .nf-desc {
        color: var(--ink-secondary);
        margin: 8px 0 32px;
      }
    </style>
  </head>
  <body>
    <main class="nf-wrap">
      <div class="nf-card">
        <p class="nf-mark" aria-hidden="true">✦</p>
        <p class="nf-code">404</p>
        <p class="nf-desc">页面不存在，或已被移动。</p>
        <a class="btn btn-primary" href="/web">返回操作台</a>
      </div>
    </main>
  </body>
</html>
